# Ka Agent's ka engine layer — ka's own strict `ka.toml` format
# (the format `ka config schema` documents; validated with
# Config::parse_layer by the worker). Referenced from ka-agent.toml as
# [ka] engine_layer = "…" and composed over ka's engine defaults.
#
# SECURITY OVERLAY: whatever is configured here, the worker ALWAYS applies
# its own security layer last, which wins over this file:
#   mode = the one the daemon sends with every open (else "ask")
#   [tools.bash] background_after_ms = 0   (no detaching bash jobs, gap G15)
#   [features] disable = ["tool:remember", "tool:cron", "tool:monitor",
#                         "tool:team", "tool:checkpoint", "tool:generate_image"]
#                         (memory goes through Ka Agent; the automation
#                         hands have no place in a daemon-driven session)
#   [guards] spend_usd from the daemon budgets
# So this file can tune the engine, never loosen policy.

# Model selector for new sessions (may be overridden by the daemon's
# `model`, which is re-asserted after every attach).
model = "anthropic/claude-sonnet-4-5"

# Permission mode. Documentation only for daemon-driven sessions: the
# worker's overlay applies the mode the daemon sends with every `open`
# (`ask` unless a session or a role sets another) after this layer. `ask`
# is the canonical word (with `accept_edits`, `allow`, `readonly`; the old
# `guarded`/`free`/`plan` spellings still parse as aliases).
mode = "ask"

# Permission profiles are not supported: a `[permissions] profile`
# activation puts its rules ahead of every `[[rules]]` row — and so ahead
# of the exact-tool allow rules the worker inserts for Ka Agent's approval
# profile — and the daemon refuses a layer that carries one. `[[rules]]`
# below is the supported form.
#
# Web search is a fallback chain: `[[search]]` rows are tried in order.
# Ka Agent's own row (`[search]` in ka-agent.toml) always goes first; rows
# written here follow as fallbacks.

# Permission rules. ka evaluates [[rules]] as data ahead of its mode logic,
# first match wins. The shape is `tool` (an engine hand name), an optional
# `pattern` (a glob on the call's primary argument: the bash command line,
# a file path) and a `verdict` of `allow`, `ask` or `deny`. Nothing else
# parses — strictly — and a layer that does not parse refuses every worker
# spawn.
#
# Read-only bash commands never ask, in any mode: the engine classifies
# them itself, so they need no rule. An `allow` rule is a real widening —
# a glob prefix `cargo test*` also matches `cargo test; …` — so prefer
# `/y <id> always`, which validates the command shape before it stores a
# rule (docs/contract/grants.md, "Durable allow-rules"). The rule below
# only tightens: in `accept_edits` or `allow` mode a push still raises its
# card.
[[rules]]
tool = "bash"
pattern = "git push*"
verdict = "ask"

[tools.bash]
# Detach bash jobs immediately? The overlay forces 0 (never background),
# so a killed worker always kills its tool children too. Kept here for
# documentation.
background_after_ms = 0
