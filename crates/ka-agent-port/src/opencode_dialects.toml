# ka-agent extras: dialects for providers the pinned ka-dialect registry
# (0.3.0) does not know yet. Overlaid over `Catalog::embedded()` by
# `catalog::full_catalog()`; ka speaks these through its normal OpenAI-chat
# wire. Rows follow models.dev (ids, context/output limits); key from the
# OpenCode console. Go = the subscription endpoint, zen = pay-per-token.

[dialects."opencode-go/beam-free"]
wire = "openai_chat"
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_API_KEY"
doc_url = "https://opencode.ai/console"
context = 1048576
max_output = 131072
input = ["text"]

