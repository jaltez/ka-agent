[package]
name = "ka-agent-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Session manager, durable queue, approvals, budgets, worker supervisor"

[dependencies]
ka-agent-core = { workspace = true }
ka-agent-port = { workspace = true }
ka-agent-store = { workspace = true }
ka-agent-memory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Feature-enabled so `ka-port-test-worker` builds for this crate's
# integration tests (same self-dev-dep trick ka-agent-port uses); the
# watchdog test spawns it as the scripted engine worker.
ka-agent-port = { path = "../ka-agent-port", features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
