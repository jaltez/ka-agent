[package]
name = "ka-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ka Agent: resident assistant on the Ka engine (daemon, admin CLI, hidden worker)"

[[bin]]
name = "ka-agent"
path = "src/main.rs"

[dependencies]
# The inline terminal client's raw mode (termios only; no TUI framework).
rustix = { version = "1", features = ["termios", "stdio"] }
ka-agent-core = { workspace = true }
ka-agent-port = { workspace = true }
ka-agent-store = { workspace = true }
ka-agent-runtime = { workspace = true }
ka-agent-memory = { workspace = true }
ka-agent-channels = { workspace = true }
ka-agent-plugins = { workspace = true }
ka-agent-web = { workspace = true }
ka-sandbox = { workspace = true }
rand_core = { workspace = true }
unicode-width = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
jiff = { workspace = true }
rpassword = { workspace = true }
toml_edit = { workspace = true }
terminal_size = { workspace = true }

[lints]
workspace = true

# Windows console support for the inline terminal client (plan 4.4): the
# safe API for raw mode, key events and console drawing, so the workspace's
# `unsafe_code = "forbid"` holds. Unix keeps rustix termios.
[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.28", default-features = false, features = ["windows", "events", "bracketed-paste"] }
