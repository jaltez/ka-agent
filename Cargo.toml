[workspace]
resolver = "3"
members = [
    "crates/ka-agent-core",
    "crates/ka-agent-port",
    "crates/ka-agent-store",
    "crates/ka-agent-runtime",
    "crates/ka-agent-channels",
    "crates/ka-agent-plugins",
    "crates/ka-agent-web",
    "crates/ka-agent-memory",
    "apps/ka-agent",
    # The example plugin the e2e suite installs (`cargo build --workspace`
    # must produce its binary; CI relies on it).
    "examples/plugins/probe",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/jaltez/ka-agent"

[workspace.dependencies]
# Ka engine crates, pinned to the exact released version (SEED.md §3.4:
# exact pin, upgraded deliberately with the contract suite green).
# v0.7.0+ (247e99e): mcp meta/lazy hands registered once at bootstrap
# (ka-harness#1 - the duplicate-tool-name 400s), strand power-loss
# durability, leaf-merged dialect overlays, landlock /dev surface,
# permission-language rename (ask|accept_edits|allow|readonly; the old
# guarded/plan spellings stay aliases). All from one source so the
# dialect/strand types crossing into ka-engine stay unified.
ka-protocol = { git = "https://github.com/jaltez/ka-harness.git", rev = "247e99e" }
ka-engine = { git = "https://github.com/jaltez/ka-harness.git", rev = "247e99e" }
ka-dialect = { git = "https://github.com/jaltez/ka-harness.git", rev = "247e99e" }
ka-strand = { git = "https://github.com/jaltez/ka-harness.git", rev = "247e99e" }
ka-sandbox = { git = "https://github.com/jaltez/ka-harness.git", rev = "247e99e" }

ka-agent-core = { path = "crates/ka-agent-core" }
ka-agent-port = { path = "crates/ka-agent-port" }
ka-agent-store = { path = "crates/ka-agent-store" }
ka-agent-runtime = { path = "crates/ka-agent-runtime" }
ka-agent-channels = { path = "crates/ka-agent-channels" }
ka-agent-web = { path = "crates/ka-agent-web" }
ka-agent-plugins = { path = "crates/ka-agent-plugins" }
ka-agent-memory = { path = "crates/ka-agent-memory" }

argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
password-hash = "0.5"
fs2 = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
unicode-width = "0.2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
toml = "0.9"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "multipart"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
jiff = "0.2"
toml_edit = "0.25"
terminal_size = "0.4"
rpassword = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
panic = "abort"
codegen-units = 1
