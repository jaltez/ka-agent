name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # macos-13 (the only x86_64 macOS pool) is retiring and its
          # runners starve for days; macos-14 cross-compiles the x86_64
          # target natively instead.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p ka-agent --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          T=${{ matrix.target }}
          tar czf "ka-agent-$T.tar.gz" -C "target/$T/release" ka-agent
          shasum -a 256 "ka-agent-$T.tar.gz" > "ka-agent-$T.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ka-agent-${{ matrix.target }}.tar.gz
            ka-agent-${{ matrix.target }}.tar.gz.sha256
