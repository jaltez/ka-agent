name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          # One macOS job builds both Darwin targets (x86_64 cross-compiles
          # natively on the arm64 runner): a second macOS job would wait for
          # a second runner from a pool that starves for hours.
          - os: macos-14
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add targets
        shell: bash
        run: rustup target add ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build and package
        shell: bash
        run: |
          for T in ${{ matrix.targets }}; do
            cargo build --release -p ka-agent --target "$T"
            tar czf "ka-agent-$T.tar.gz" -C "target/$T/release" ka-agent
            shasum -a 256 "ka-agent-$T.tar.gz" > "ka-agent-$T.tar.gz.sha256"
          done

      # Sigstore-backed provenance: `gh attestation verify <tarball>
      # --repo jaltez/ka-agent` proves the archive came from this workflow.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ka-agent-*.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ka-agent-*.tar.gz
            ka-agent-*.tar.gz.sha256
