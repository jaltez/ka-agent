name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Ka dependency boundary gate
        run: ./scripts/check-ka-deps.sh

      - name: Install bubblewrap (plugin sandbox)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which
          # bubblewrap needs; the runner is unprivileged.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - name: Build (the example plugin binary the tests install)
        run: cargo build --workspace --quiet
      - name: Tests
        run: cargo test --workspace --quiet

  ci-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Ka dependency boundary gate
        run: ./scripts/check-ka-deps.sh

      # bubblewrap is Linux-only: plugin e2e and /proc probes are gated out.
      - name: Tests
        run: cargo test --workspace --quiet

  # Windows (plan 4.x): the whole workspace builds — the admin transport is
  # a named pipe there, the worker tree dies with taskkill /T, the service
  # is a Task Scheduler entry, and the chat falls back to line mode when the
  # console is not a TTY. Tests stay on Unix (they drive Unix paths and
  # signals); the Windows job proves the build.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: Format
        run: cargo fmt --all -- --check
      # Library and binary targets only: the integration tests drive Unix
      # paths, signals and the admin socket, and stay on the Unix jobs.
      - name: Clippy
        run: cargo clippy --workspace --lib --bins --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build the binary for Windows
        run: cargo build --release -p ka-agent --target x86_64-pc-windows-msvc
