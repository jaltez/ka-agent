name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The workspace pins the ka crates to a local file:// mirror of
      # github.com/jaltez/ka-harness (see README.md). Rewrite the pin to the public
      # repository before building; cargo fetches it normally (no --offline).
      - name: Point the ka pin at the public repository
        run: |
          sed -i 's|git = "file:///home/javier/projects/ka-harness"|git = "https://github.com/jaltez/ka-harness"|g' Cargo.toml crates/*/Cargo.toml apps/*/Cargo.toml
          ! grep -rn 'file:///home/javier' Cargo.toml crates/*/Cargo.toml apps/*/Cargo.toml

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Ka dependency boundary gate
        run: ./scripts/check-ka-deps.sh

      - name: Install bubblewrap (plugin sandbox)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Tests
        run: cargo test --workspace --quiet
